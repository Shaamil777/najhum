<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EV Charging Station 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #e5edf8 0%, #edf2fa 50%, #dee7f5 100%);
      cursor: grab;
    }
    body:active {
      cursor: grabbing;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
    }
  </style>
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <script>
    window.onload = function () {
      // ============================================================================
      // 1. SCENE, CAMERA & RENDERER SETUP (DEPTH-PRECISION OPTIMIZED)
      // ============================================================================
      const scene = new THREE.Scene();

      // Tightened near/far frustum (5 to 140) and logarithmicDepthBuffer to completely eliminate Z-fighting
      const camera = new THREE.PerspectiveCamera(
        20,
        window.innerWidth / window.innerHeight,
        5,
        140
      );
      camera.position.set(33, 36, 35);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        logarithmicDepthBuffer: true,
        powerPreference: "high-performance"
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.LinearEncoding;
      renderer.toneMapping = THREE.NoToneMapping;
      document.body.appendChild(renderer.domElement);

      // OrbitControls for smooth cursor hover/drag viewing
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(-0.3, 0.8, 0.6);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.rotateSpeed = 0.75;
      controls.zoomSpeed = 0.9;
      controls.panSpeed = 0.75;
      controls.minDistance = 18;
      controls.maxDistance = 95;
      controls.maxPolarAngle = Math.PI / 2 - 0.04; // Prevent going below ground
      controls.minPolarAngle = 0.15;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.0;
      controls.update();

      // ============================================================================
      // 2. BALANCED SOFT STUDIO ISOMETRIC LIGHTING (NO SHADOW ACNE OR OVEREXPOSURE)
      // ============================================================================
      const hemiLight = new THREE.HemisphereLight(0xf2f6fc, 0xc3d2e8, 0.36);
      hemiLight.position.set(0, 55, 0);
      scene.add(hemiLight);

      const ambientLight = new THREE.AmbientLight(0xdce6f5, 0.32);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfffdf9, 0.46);
      dirLight.position.set(-22, 42, 26);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 15;
      dirLight.shadow.camera.far = 95;
      const d = 25;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      dirLight.shadow.bias = -0.0008;
      dirLight.shadow.normalBias = 0.02;
      dirLight.shadow.radius = 3.0;
      scene.add(dirLight);

      const fillLight = new THREE.DirectionalLight(0xaec6eb, 0.18);
      fillLight.position.set(28, 18, -12);
      scene.add(fillLight);

      // ============================================================================
      // 3. SHARED MATERIALS & PROCEDURAL CANVAS TEXTURES
      // ============================================================================
      const mats = {
        "white Glossy": new THREE.MeshLambertMaterial({
          color: 0xeef3fb
        }),
        whiteMatte: new THREE.MeshLambertMaterial({
          color: 0xe1e9f5
        }),
        roofTrayGrey: new THREE.MeshLambertMaterial({
          color: 0xd0dced
        }),
        loungeRoofGrey: new THREE.MeshLambertMaterial({
          color: 0xc2cfe3
        }),
        concrete: new THREE.MeshLambertMaterial({
          color: 0xd2dceb
        }),
        apronGrey: new THREE.MeshLambertMaterial({
          color: 0xc2cee0,
          polygonOffset: true,
          polygonOffsetFactor: -1,
          polygonOffsetUnits: -1
        }),
        drivewayGrey: new THREE.MeshLambertMaterial({
          color: 0x8d9cb0
        }),
        roadAsphalt: new THREE.MeshLambertMaterial({
          color: 0x64758c
        }),
        brandBlue: new THREE.MeshLambertMaterial({
          color: 0x185ee0
        }),
        softBlueCap: new THREE.MeshLambertMaterial({
          color: 0x4f89e6
        }),
        loungeBluePanel: new THREE.MeshLambertMaterial({
          color: 0x4c8be8
        }),
        darkMetal: new THREE.MeshLambertMaterial({
          color: 0x3b4554
        }),
        charcoal: new THREE.MeshLambertMaterial({
          color: 0x1c2536
        }),
        warmGlow: new THREE.MeshBasicMaterial({
          color: 0xffdf85
        }),
        glass: new THREE.MeshPhysicalMaterial({
          color: 0xc8def7,
          transparent: true,
          opacity: 0.34,
          roughness: 0.12,
          metalness: 0.05,
          reflectivity: 0.7,
          depthWrite: false
        }),
        carGlass: new THREE.MeshStandardMaterial({
          color: 0x1a2230,
          roughness: 0.15,
          metalness: 0.35
        }),
        foliageLight: new THREE.MeshLambertMaterial({
          color: 0x7ca657
        }),
        foliageMed: new THREE.MeshLambertMaterial({
          color: 0x648f44
        }),
        foliageDark: new THREE.MeshLambertMaterial({
          color: 0x4b7031
        }),
        soil: new THREE.MeshLambertMaterial({
          color: 0x574e42
        })
      };

      function setTextureColorSpace(tex) {
        tex.encoding = THREE.LinearEncoding;
      }

      // Helper: create rounded rectangle THREE.Shape
      function createRoundedRectShape(width, height, radius) {
        const shape = new THREE.Shape();
        const x = -width / 2;
        const y = -height / 2;
        const r = Math.min(radius, width / 2, height / 2);
        shape.moveTo(x + r, y);
        shape.lineTo(x + width - r, y);
        shape.quadraticCurveTo(x + width, y, x + width, y + r);
        shape.lineTo(x + width, y + height - r);
        shape.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
        shape.lineTo(x + r, y + height);
        shape.quadraticCurveTo(x, y + height, x, y + height - r);
        shape.lineTo(x, y + r);
        shape.quadraticCurveTo(x, y, x + r, y);
        return shape;
      }

      // Helper: create extruded rounded slab placed horizontally in XZ plane
      // Bottom is at y = 0 and top surface is strictly at y = heightY
      function createRoundedSlab(widthX, depthZ, heightY, radius, material, bevel = 0.05) {
        const b = Math.min(bevel, heightY * 0.35);
        const coreDepth = Math.max(0.01, heightY - b * 2);
        const shape = createRoundedRectShape(widthX - b * 2, depthZ - b * 2, Math.max(0.02, radius - b));
        const geo = new THREE.ExtrudeGeometry(shape, {
          depth: coreDepth,
          bevelEnabled: b > 0,
          bevelThickness: b,
          bevelSize: b,
          bevelSegments: 4,
          curveSegments: 16
        });
        geo.rotateX(-Math.PI / 2);
        geo.translate(0, b, 0); // Shift up so bottom sits cleanly at local y = 0, top at y = heightY
        geo.computeVertexNormals();
        const mesh = new THREE.Mesh(geo, material);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      // Helper: Procedural Canvas Texture for EV Blue Parking Bay with Lightning Icon
      function createBayTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 768;
        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "#75aaf0";
        ctx.fillRect(0, 0, 512, 768);

        ctx.strokeStyle = "#f2f6fc";
        ctx.lineWidth = 14;
        ctx.strokeRect(18, 18, 476, 732);

        ctx.lineWidth = 8;
        ctx.setLineDash([36, 26]);
        ctx.beginPath();
        ctx.moveTo(46, 44);
        ctx.lineTo(46, 722);
        ctx.moveTo(466, 44);
        ctx.lineTo(466, 722);
        ctx.stroke();
        ctx.setLineDash([]);

        const bx = 176, by = 415, bw = 160, bh = 160, br = 28;
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(bx + br, by);
        ctx.lineTo(bx + bw - br, by);
        ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + br);
        ctx.lineTo(bx + bw, by + bh - br);
        ctx.quadraticCurveTo(bx + bw, yEnd = by + bh, bx + bw - br, by + bh);
        ctx.lineTo(bx + br, by + bh);
        ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - br);
        ctx.lineTo(bx, by + br);
        ctx.quadraticCurveTo(bx, by, bx + br, by);
        ctx.stroke();

        ctx.fillStyle = "#f2f6fc";
        ctx.beginPath();
        ctx.moveTo(268, 439);
        ctx.lineTo(222, 501);
        ctx.lineTo(254, 501);
        ctx.lineTo(242, 551);
        ctx.lineTo(290, 487);
        ctx.lineTo(258, 487);
        ctx.closePath();
        ctx.fill();

        const tex = new THREE.CanvasTexture(canvas);
        setTextureColorSpace(tex);
        tex.anisotropy = 8;
        return tex;
      }

      // Helper: Procedural Canvas Texture for Charger Front Face (Lightning Icon + Screen)
      function createChargerFrontTexture(initialSoc = 78) {
        const canvas = document.createElement("canvas");
        canvas.width = 256;
        canvas.height = 512;
        const ctx = canvas.getContext("2d");

        function draw(soc) {
          ctx.fillStyle = "#eef3fb";
          ctx.fillRect(0, 0, 256, 512);

          ctx.fillStyle = "#185ee0";
          ctx.beginPath();
          ctx.moveTo(138, 48);
          ctx.lineTo(96, 112);
          ctx.lineTo(126, 112);
          ctx.lineTo(114, 166);
          ctx.lineTo(160, 100);
          ctx.lineTo(130, 100);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = "#161f2e";
          const px = 42, py = 200, pw = 172, ph = 185, pr = 18;
          ctx.beginPath();
          ctx.moveTo(px + pr, py);
          ctx.lineTo(px + pw - pr, py);
          ctx.quadraticCurveTo(px + pw, py, px + pw, py + pr);
          ctx.lineTo(px + pw, py + ph - pr);
          ctx.quadraticCurveTo(px + pw, py + ph, px + pw - pr, py + ph);
          ctx.lineTo(px + pr, py + ph);
          ctx.quadraticCurveTo(px, py + ph, px, py + ph - pr);
          ctx.lineTo(px, py + pr);
          ctx.quadraticCurveTo(px, py, px + pr, py);
          ctx.fill();

          ctx.fillStyle = "#0d1420";
          ctx.fillRect(58, 218, 140, 74);

          ctx.fillStyle = "#3b82f6";
          const fillW = Math.max(18, Math.min(120, (soc / 100) * 120));
          ctx.fillRect(68, 232, fillW, 18);

          ctx.fillStyle = "#60a5fa";
          ctx.fillRect(68, 258, 84, 8);
          ctx.fillRect(68, 272, 54, 8);

          ctx.fillStyle = "#0e1522";
          ctx.fillRect(92, 308, 72, 58);
          ctx.strokeStyle = "#2b6cb0";
          ctx.lineWidth = 3;
          ctx.strokeRect(98, 314, 60, 46);
        }

        draw(initialSoc);
        const tex = new THREE.CanvasTexture(canvas);
        setTextureColorSpace(tex);
        return { tex, draw };
      }

      // ============================================================================
      // 4. STATION GROUND, ROADWAY, DRIVEWAY & CURBS (ZERO COPLANAR OVERLAP)
      // ============================================================================
      const stationGroup = new THREE.Group();
      scene.add(stationGroup);

      // Infinite subtle studio floor plane well below slabs
      const shadowFloor = new THREE.Mesh(
        new THREE.PlaneGeometry(220, 220),
        new THREE.ShadowMaterial({ color: 0x7b93b8, opacity: 0.18 })
      );
      shadowFloor.rotation.x = -Math.PI / 2;
      shadowFloor.position.y = -0.35;
      shadowFloor.receiveShadow = true;
      scene.add(shadowFloor);

      // 4.1 Main Station Concrete Island Base (#d2dceb) - Top surface at y = 0.22
      const mainPad = createRoundedSlab(36.5, 19.5, 0.44, 1.4, mats.concrete, 0.05);
      mainPad.position.set(-0.2, -0.22, -1.6);
      stationGroup.add(mainPad);

      // Darker cool-grey parking apron surface under the bays & 4th bay (#c2cee0)
      const bayApron = new THREE.Mesh(
        new THREE.PlaneGeometry(22.2, 8.2),
        mats.apronGrey
      );
      bayApron.rotation.x = -Math.PI / 2;
      bayApron.position.set(2.1, 0.232, -0.35);
      bayApron.receiveShadow = true;
      stationGroup.add(bayApron);

      // 4.2 Entry Driveway on Right (+X side, stops cleanly at road edge so it never intersects road)
      // Top surface at y = 0.235
      const drivewayMesh = createRoundedSlab(9.6, 13.0, 0.455, 0.7, mats.drivewayGrey, 0.03);
      drivewayMesh.position.set(13.2, -0.22, 1.45);
      stationGroup.add(drivewayMesh);

      // 4.3 Main Roadway along bottom-left (+Z edge, running along X) (#64758c)
      // Top surface at y = 0.245 (strictly above driveway and concrete pad)
      const roadLength = 42.0;
      const roadWidth = 6.8;
      const roadMesh = createRoundedSlab(roadLength, roadWidth, 0.465, 0.35, mats.roadAsphalt, 0.03);
      roadMesh.position.set(-1.5, -0.22, 11.2);
      stationGroup.add(roadMesh);

      // Crisp soft-white road edge line & center dashed lane markings
      const edgeLineMat = new THREE.MeshBasicMaterial({
        color: 0xf4f7fc,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2
      });
      const roadSideLine = new THREE.Mesh(new THREE.PlaneGeometry(roadLength - 1.2, 0.18), edgeLineMat);
      roadSideLine.rotation.x = -Math.PI / 2;
      roadSideLine.position.set(-1.5, 0.258, 8.15);
      stationGroup.add(roadSideLine);

      for (let rx = -19.5; rx <= 11.5; rx += 3.6) {
        const dash = new THREE.Mesh(new THREE.PlaneGeometry(1.75, 0.22), edgeLineMat);
        dash.rotation.x = -Math.PI / 2;
        dash.position.set(rx, 0.258, 11.25);
        stationGroup.add(dash);
      }

      // White rounded curb along right-hand edge of the driveway
      const rightDrivewayCurb = createRoundedSlab(0.85, 11.2, 0.32, 0.35, mats.whiteMatte, 0.04);
      rightDrivewayCurb.position.set(17.95, 0.22, 7.2);
      stationGroup.add(rightDrivewayCurb);

      // Driveway white border lines
      const rightEdgeLine = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 13.0), edgeLineMat);
      rightEdgeLine.rotation.x = -Math.PI / 2;
      rightEdgeLine.position.set(17.35, 0.26, 4.3);
      stationGroup.add(rightEdgeLine);

      const leftDrivewayLine = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 6.4), edgeLineMat);
      leftDrivewayLine.rotation.x = -Math.PI / 2;
      leftDrivewayLine.position.set(8.55, 0.26, 7.7);
      stationGroup.add(leftDrivewayLine);

      // Helper to create crisp white directional arrow on pavement
      function createPavementArrow(x, z, scale = 1, rotY = 0) {
        const arrowShape = new THREE.Shape();
        arrowShape.moveTo(0, 1.38);
        arrowShape.lineTo(0.74, 0.36);
        arrowShape.lineTo(0.27, 0.36);
        arrowShape.lineTo(0.27, -1.28);
        arrowShape.lineTo(-0.27, -1.28);
        arrowShape.lineTo(-0.27, 0.36);
        arrowShape.lineTo(-0.74, 0.36);
        arrowShape.closePath();

        const geo = new THREE.ShapeGeometry(arrowShape);
        geo.rotateX(-Math.PI / 2);
        const mesh = new THREE.Mesh(geo, edgeLineMat);
        mesh.scale.set(scale, 1, scale);
        mesh.rotation.y = rotY;
        mesh.position.set(x, 0.262, z);
        return mesh;
      }

      stationGroup.add(createPavementArrow(10.8, 8.9, 1.08, 0));
      stationGroup.add(createPavementArrow(15.2, 2.5, 0.88, 0));

      // ============================================================================
      // 5. THREE BLUE EV CHARGING BAYS + PAVEMENT LINES
      // ============================================================================
      const bayTex = createBayTexture();
      const bayMat = new THREE.MeshLambertMaterial({
        map: bayTex,
        polygonOffset: true,
        polygonOffsetFactor: -1,
        polygonOffsetUnits: -1
      });

      const bayCentersX = [-6.2, -0.6, 5.0];
      const bayZ = -0.35;

      bayCentersX.forEach((bx) => {
        const bayMesh = new THREE.Mesh(new THREE.PlaneGeometry(5.3, 7.8), bayMat);
        bayMesh.rotation.x = -Math.PI / 2;
        bayMesh.position.set(bx, 0.248, bayZ);
        bayMesh.receiveShadow = true;
        stationGroup.add(bayMesh);
      });

      // 4th light-grey bay outline on the right
      const greyBayGroup = new THREE.Group();
      greyBayGroup.position.set(10.4, 0.252, bayZ);
      const gbTop = new THREE.Mesh(new THREE.PlaneGeometry(5.0, 0.16), edgeLineMat);
      gbTop.rotation.x = -Math.PI / 2;
      gbTop.position.set(0, 0, -3.75);
      greyBayGroup.add(gbTop);

      const gbRight = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 7.6), edgeLineMat);
      gbRight.rotation.x = -Math.PI / 2;
      gbRight.position.set(2.45, 0, 0);
      greyBayGroup.add(gbRight);

      for (let dz = -3.1; dz <= 3.3; dz += 0.9) {
        const dLine = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 0.48), edgeLineMat);
        dLine.rotation.x = -Math.PI / 2;
        dLine.position.set(-2.35, 0, dz);
        greyBayGroup.add(dLine);
      }
      stationGroup.add(greyBayGroup);

      // ============================================================================
      // 6. PLANTER BEDS, CURBS, FOLIAGE & BOLLARD LIGHTS
      // ============================================================================
      function createBollardLight(x, y, z) {
        const group = new THREE.Group();
        group.position.set(x, y, z);

        const post = new THREE.Mesh(
          new THREE.CylinderGeometry(0.2, 0.22, 1.15, 20),
          mats.darkMetal
        );
        post.position.y = 0.575;
        post.castShadow = true;
        post.receiveShadow = true;
        group.add(post);

        const lamp = new THREE.Mesh(
          new THREE.CylinderGeometry(0.18, 0.18, 0.34, 20),
          mats.warmGlow
        );
        lamp.position.y = 1.28;
        group.add(lamp);

        const cap = new THREE.Mesh(
          new THREE.CylinderGeometry(0.205, 0.205, 0.08, 20),
          mats.darkMetal
        );
        cap.position.y = 1.48;
        group.add(cap);

        return group;
      }

      function createBushCluster(x, y, z, scale = 1, isTree = false, matIndex = 0) {
        const group = new THREE.Group();
        group.position.set(x, y, z);

        if (isTree) {
          const trunk = new THREE.Mesh(
            new THREE.CylinderGeometry(0.08 * scale, 0.12 * scale, 0.95 * scale, 12),
            mats.soil
          );
          trunk.position.y = 0.45 * scale;
          trunk.castShadow = true;
          group.add(trunk);

          const crown = new THREE.Mesh(
            new THREE.SphereGeometry(0.78 * scale, 24, 20),
            mats.foliageLight
          );
          crown.scale.set(0.92, 1.12, 0.92);
          crown.position.y = 1.25 * scale;
          crown.castShadow = true;
          crown.receiveShadow = true;
          group.add(crown);
        } else {
          const matChoice = matIndex % 2 === 0 ? mats.foliageLight : mats.foliageMed;
          const mainSphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.55 * scale, 20, 16),
            matChoice
          );
          mainSphere.scale.set(1.05, 0.88, 1.05);
          mainSphere.position.y = 0.42 * scale;
          mainSphere.castShadow = true;
          mainSphere.receiveShadow = true;
          group.add(mainSphere);

          const subSphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.38 * scale, 16, 14),
            mats.foliageDark
          );
          subSphere.position.set(0.35 * scale, 0.28 * scale, 0.18 * scale);
          subSphere.castShadow = true;
          group.add(subSphere);
        }
        return group;
      }

      function createPlanterBox(w, d, h, x, y, z) {
        const group = new THREE.Group();
        group.position.set(x, y, z);

        const outerWall = createRoundedSlab(w, d, h, 0.45, mats.whiteMatte, 0.04);
        group.add(outerWall);

        // Soil bed sits strictly on top of outerWall at y = h + 0.01 (no coplanar overlap)
        const soilBed = createRoundedSlab(w - 0.36, d - 0.36, 0.08, 0.3, mats.soil, 0.01);
        soilBed.position.y = h - 0.04;
        group.add(soilBed);

        return group;
      }

      // 6.1 Front Roadside Divider Island & Planter (between bays and road)
      const frontIsland = createRoundedSlab(15.6, 3.2, 0.22, 0.9, mats.whiteMatte, 0.04);
      frontIsland.position.set(-1.8, 0.22, 5.7);
      stationGroup.add(frontIsland);

      const frontPlanter = createPlanterBox(12.2, 1.65, 0.45, -2.6, 0.44, 5.75);
      stationGroup.add(frontPlanter);

      stationGroup.add(createBushCluster(-7.8, 0.88, 5.75, 0.85, false, 0));
      stationGroup.add(createBollardLight(-6.6, 0.88, 5.75));
      stationGroup.add(createBushCluster(-5.3, 0.88, 5.75, 0.95, true, 1));
      stationGroup.add(createBushCluster(-3.8, 0.88, 5.75, 0.9, false, 0));
      stationGroup.add(createBushCluster(-2.4, 0.88, 5.75, 0.78, false, 1));
      stationGroup.add(createBollardLight(-1.2, 0.88, 5.75));
      stationGroup.add(createBushCluster(0.1, 0.88, 5.75, 1.05, true, 0));
      stationGroup.add(createBushCluster(1.5, 0.88, 5.75, 0.82, false, 1));
      stationGroup.add(createBollardLight(2.4, 0.88, 5.75));
      stationGroup.add(createBushCluster(3.1, 0.88, 5.75, 0.65, false, 0));

      const pinPost = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.06, 0.65, 12),
        mats.darkMetal
      );
      pinPost.position.set(5.1, 0.76, 6.35);
      stationGroup.add(pinPost);
      const pinTip = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), mats.warmGlow);
      pinTip.position.set(5.1, 1.12, 6.35);
      stationGroup.add(pinTip);

      // 6.2 Back Charger Curb Platform & Back Planter Bed (-Z side)
      const chargerCurb = createRoundedSlab(23.5, 3.2, 0.24, 0.6, mats.whiteMatte, 0.04);
      chargerCurb.position.set(1.6, 0.22, -5.8);
      stationGroup.add(chargerCurb);

      const backPlanter = createPlanterBox(23.2, 2.1, 0.58, 1.6, 0.46, -7.85);
      stationGroup.add(backPlanter);

      const backFoliageSpecs = [
        { x: -9.2, s: 1.15, tree: true },
        { x: -7.6, s: 0.95, tree: false },
        { x: -4.2, s: 0.9, tree: false },

        shellGeo.translate(0, 0.14, -bodyD / 2);

          const cableMesh = new THREE.Mesh(cableGeo, mats.charcoal);
          cableMesh.castShadow = true;
          group.add(cableMesh);

        return group;

      function createEVSedan(bodyColorHex, isWhiteCar = false) {
        const carGroup = new THREE.Group();

        const paintMat = new THREE.MeshStandardMaterial({
          color: bodyColorHex,
          roughness: isWhiteCar ? 0.32 : 0.28,
          metalness: isWhiteCar ? 0.04 : 0.12

        const tailLightMat = new THREE.MeshBasicMaterial({

        // 11.1 Lower Aerodynamic Chassis Floorpan (narrowed to 1.82 so it never Z-fights with side body panels)

        chassisBase.position.y = 0.20;
        carGroup.add(chassisBase);

        // 11.2 Main Sculpted Body Side Profile (Extruded along X, then centered)
        const sideShape = new THREE.Shape();
        sideShape.moveTo(-2.32, 0.34);
        sideShape.quadraticCurveTo(-2.36, 0.68, -2.05, 0.82);
        sideShape.quadraticCurveTo(-1.35, 0.96, -0.82, 1.02);
        sideShape.lineTo(1.55, 1.06);
        sideShape.quadraticCurveTo(2.22, 1.05, 2.32, 0.88);
        sideShape.lineTo(2.30, 0.34);
        sideShape.closePath();

        const lowerBodyGeo = new THREE.ExtrudeGeometry(sideShape, {
          depth: 1.92,
          bevelEnabled: true,
          bevelThickness: 0.12,
          bevelSize: 0.09,
          bevelSegments: 6,
          curveSegments: 24
        });
        lowerBodyGeo.rotateY(-Math.PI / 2);
        lowerBodyGeo.translate(0.96, 0, 0);
        lowerBodyGeo.computeVertexNormals();

        const lowerBodyMesh = new THREE.Mesh(lowerBodyGeo, paintMat);
        lowerBodyMesh.castShadow = true;
        lowerBodyMesh.receiveShadow = true;
        carGroup.add(lowerBodyMesh);

        // 11.3 Sleek Fastback Panoramic Black Glass Cabin & Roof
        const cabinShape = new THREE.Shape();
        cabinShape.moveTo(-1.02, 0.98);
        cabinShape.quadraticCurveTo(-0.42, 1.48, 0.22, 1.50);
        cabinShape.quadraticCurveTo(1.12, 1.48, 1.92, 1.04);
        cabinShape.closePath();

        const cabinGeo = new THREE.ExtrudeGeometry(cabinShape, {
          depth: 1.54,
          bevelEnabled: true,
          bevelThickness: 0.11,
          bevelSize: 0.08,
          bevelSegments: 6,
          curveSegments: 24
        });
        cabinGeo.rotateY(-Math.PI / 2);
        cabinGeo.translate(0.77, 0, 0);
        cabinGeo.computeVertexNormals();

        const cabinMesh = new THREE.Mesh(cabinGeo, mats.carGlass);
        cabinMesh.castShadow = true;
        carGroup.add(cabinMesh);

        // Body-colored Roof Side Rails / Pillars
        [-1, 1].forEach((side) => {
          const railShape = new THREE.Shape();
          railShape.moveTo(-0.98, 1.00);
          railShape.quadraticCurveTo(-0.38, 1.46, 0.22, 1.48);
          railShape.quadraticCurveTo(1.08, 1.46, 1.88, 1.04);
          railShape.lineTo(1.66, 1.04);
          railShape.quadraticCurveTo(0.98, 1.37, 0.22, 1.39);
          railShape.quadraticCurveTo(-0.32, 1.37, -0.78, 1.00);
          railShape.closePath();

          const railGeo = new THREE.ExtrudeGeometry(railShape, {
            depth: 0.07,
            bevelEnabled: true,
            bevelThickness: 0.02,
            bevelSize: 0.02,
            bevelSegments: 3
          });
          railGeo.rotateY(-Math.PI / 2);
          railGeo.translate(side * 0.85 + 0.035, 0, 0);
          const railMesh = new THREE.Mesh(railGeo, paintMat);
          carGroup.add(railMesh);

          const mirror = createRoundedSlab(0.24, 0.16, 0.12, 0.05, paintMat, 0.02);
          mirror.position.set(side * 1.06, 1.04, -0.68);
          carGroup.add(mirror);
        });

        // 11.4 Continuous Full-Width Glowing Red LED Taillight Bar (Rear is +Z)
        const tailBar = new THREE.Mesh(
          new THREE.BoxGeometry(1.86, 0.075, 0.08),
          tailLightMat
        );
        tailBar.position.set(0, 0.91, 2.38);
        carGroup.add(tailBar);

        [-1, 1].forEach((side) => {
          const tailWrap = new THREE.Mesh(
            new THREE.BoxGeometry(0.06, 0.075, 0.32),
            tailLightMat
          );
          tailWrap.position.set(side * 0.95, 0.91, 2.24);
          carGroup.add(tailWrap);
        });

        // 11.5 Sleek LED Headlights (Front is -Z)
        [-1, 1].forEach((side) => {
          const headLamp = new THREE.Mesh(
            new THREE.BoxGeometry(0.46, 0.07, 0.12),
            headLightMat
          );
          headLamp.position.set(side * 0.68, 0.72, -2.35);
          headLamp.rotation.y = side * 0.18;
          carGroup.add(headLamp);
        });

        // 11.6 Charging Port Flap on Right-Rear Quarter Panel (+X, +Z)
        const portSocket = new THREE.Mesh(
          new THREE.CylinderGeometry(0.095, 0.095, 0.04, 18),
          mats.charcoal
        );
        portSocket.rotation.z = Math.PI / 2;
        portSocket.position.set(1.08, 0.92, 0.95);
        carGroup.add(portSocket);

        // Glowing blue charging status ring inside the port on the white car
        if (isWhiteCar) {
          const portRing = new THREE.Mesh(
            new THREE.CylinderGeometry(0.07, 0.07, 0.048, 18),
            new THREE.MeshBasicMaterial({ color: 0x3b82f6 })
          );
          portRing.rotation.z = Math.PI / 2;
          portRing.position.set(1.082, 0.92, 0.95);
          carGroup.add(portRing);
        }

        // 11.7 Four Detailed Multi-Spoke Alloy Wheels (non-overlapping rim/hub geometry)
        const wheels = [];
        const wheelPositions = [
          { x: -0.98, z: -1.42, isFront: true },
          { x: 0.98, z: -1.42, isFront: true },
          { x: -0.98, z: 1.42, isFront: false },
          { x: 0.98, z: 1.42, isFront: false }
        ];

        const rimMat = new THREE.MeshStandardMaterial({
          color: 0xd8e2f0,
          roughness: 0.22,
          metalness: 0.75
        });

        wheelPositions.forEach((wp) => {
          const wheelPivot = new THREE.Group();
          wheelPivot.position.set(wp.x, 0.42, wp.z);

          const wheelSpin = new THREE.Group();
          wheelPivot.add(wheelSpin);

          // Rubber Tire
          const tire = new THREE.Mesh(
            new THREE.CylinderGeometry(0.42, 0.42, 0.26, 28),
            mats.charcoal
          );
          tire.rotation.z = Math.PI / 2;
          tire.castShadow = true;
          wheelSpin.add(tire);

          // Dark Inner Brake Hub (slightly wider than tire)
          const innerHub = new THREE.Mesh(
            new THREE.CylinderGeometry(0.29, 0.29, 0.275, 22),
            mats.darkMetal
          );
          innerHub.rotation.z = Math.PI / 2;
          wheelSpin.add(innerHub);

          // Outer Silver Rim Cap & 5 Turbine Spokes (placed cleanly on outer face)
          const sideSign = wp.x > 0 ? 1 : -1;
          const rimRing = new THREE.Mesh(
            new THREE.TorusGeometry(0.285, 0.025, 12, 24),
            rimMat
          );
          rimRing.rotation.y = Math.PI / 2;
          rimRing.position.set(sideSign * 0.135, 0, 0);
          wheelSpin.add(rimRing);

          const centerCap = new THREE.Mesh(
            new THREE.CylinderGeometry(0.065, 0.065, 0.03, 16),
            rimMat
          );
          centerCap.rotation.z = Math.PI / 2;
          centerCap.position.set(sideSign * 0.14, 0, 0);
          wheelSpin.add(centerCap);

          for (let s = 0; s < 5; s++) {
            const angle = (s / 5) * Math.PI * 2;
            const spoke = new THREE.Mesh(
              new THREE.BoxGeometry(0.025, 0.26, 0.055),
              rimMat
            );
            spoke.position.set(
              sideSign * 0.14,
              Math.cos(angle) * 0.13,
              Math.sin(angle) * 0.13
            );
            spoke.rotation.x = -angle;
            wheelSpin.add(spoke);
          }

          carGroup.add(wheelPivot);
          wheels.push({ pivot: wheelPivot, spin: wheelSpin, isFront: wp.isFront });
        });

        return {
          group: carGroup,
          wheels,
          tailLightMat
        };
      }

      // ============================================================================
      // 12. STATIONARY CARS & UNCLIPPED EV CHARGING GUN + CABLE
      // ============================================================================
      // 12.1 Soft Pearl-Alabaster White EV Sedan parked stationary in Middle Bay (Bay 2)
      const whiteCar = createEVSedan(0xeef3fb, true);
      whiteCar.group.position.set(-1.05, 0.248, -0.75);
      whiteCar.group.rotation.y = -0.04;
      stationGroup.add(whiteCar.group);

      // EV Charging Gun Nozzle & Handle attached directly inside whiteCar's local coordinate system
      // so it connects flush to the port at (1.08, 0.92, 0.95) and stays well away from the tires
      const evGunGroup = new THREE.Group();
      evGunGroup.position.set(1.08, 0.92, 0.95);
      whiteCar.group.add(evGunGroup);

      // Nozzle barrel inserted horizontally into the car port
      const nozzleBarrel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.052, 0.058, 0.18, 16),
        mats.charcoal
      );
      nozzleBarrel.rotation.z = Math.PI / 2;
      nozzleBarrel.position.set(0.08, 0, 0);
      nozzleBarrel.castShadow = true;
      evGunGroup.add(nozzleBarrel);

      // Blue LED charging collar on EV gun
      const nozzleCollar = new THREE.Mesh(
        new THREE.CylinderGeometry(0.062, 0.062, 0.035, 16),
        mats.brandBlue
      );
      nozzleCollar.rotation.z = Math.PI / 2;
      nozzleCollar.position.set(0.14, 0, 0);
      evGunGroup.add(nozzleCollar);

      // Angled ergonomic pistol-grip handle curving outward and downward (+X, -Y, -Z)
      const gripBody = new THREE.Mesh(
        new THREE.CylinderGeometry(0.048, 0.042, 0.24, 16),
        mats.charcoal
      );
      gripBody.position.set(0.24, -0.07, -0.04);
      gripBody.rotation.set(0.28, 0, 0.68);
      gripBody.castShadow = true;
      evGunGroup.add(gripBody);

      // Smooth Catenary Black Charging Cable from Middle Charger (Charger 2) to EV Gun Grip
      // Routed safely around X = +0.58 to +0.62 so it clears the front-right tire (at X ≈ 0.06) by > 0.5 units
      const activeCablePoints = [
        new THREE.Vector3(-0.60, 1.84, -5.05),  // Charger 2 front central holster
        new THREE.Vector3(-0.22, 0.96, -4.25),  // Smooth downward drop from charger
        new THREE.Vector3(0.42, 0.29, -3.15),   // Sweeping right onto the pavement ahead of car nose
        new THREE.Vector3(0.62, 0.29, -1.95),   // Curving cleanly outside front-right wheel well (zero tire clipping)
        new THREE.Vector3(0.56, 0.44, -0.65),   // Rising gracefully alongside the passenger door
        new THREE.Vector3(0.26, 1.09, 0.19)     // Entering the base of the EV gun grip at the rear quarter port
      ];
      const activeCableCurve = new THREE.CatmullRomCurve3(activeCablePoints);
      const activeCableGeo = new THREE.TubeGeometry(activeCableCurve, 64, 0.040, 12, false);
      const activeCableMesh = new THREE.Mesh(activeCableGeo, mats.charcoal);
      activeCableMesh.castShadow = true;
      stationGroup.add(activeCableMesh);

      // 12.2 Deep Royal Blue EV Sedan stationary on Right-Hand Entrance Driveway
      const blueCar = createEVSedan(0x1c62de, false);
      blueCar.group.position.set(11.85, 0.235, 4.85);
      blueCar.group.rotation.y = 0.06;
      stationGroup.add(blueCar.group);

      // ============================================================================
      // 13. WINDOW RESIZE HANDLER & ORBIT RENDER LOOP
      // ============================================================================
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      animate();
    };
  </script>
</body>
</html>
